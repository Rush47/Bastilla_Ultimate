name: Bastilla Ultimate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bastilla-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript checks
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: MCP stdio protocol smoke test (no model calls)
        env:
          BASTILLA_API_TOKEN: ci-only-synthetic-token
        run: |
          printf '%s\\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' '{"jsonrpc":"2.0","id":3,"method":"ping","params":{}}' | npx tsx server/mcp-stdio.ts > /tmp/bastilla-mcp-stdio.jsonl
          node --input-type=module -e 'import fs from "node:fs"; const lines=fs.readFileSync("/tmp/bastilla-mcp-stdio.jsonl","utf8").trim().split("\\n").map(JSON.parse); if(lines.length!==3 || lines[0].result?.serverInfo?.name!=="bastilla-ultimate" || !Array.isArray(lines[1].result?.tools) || !lines[2].result) process.exit(1);'
      - name: Check whitespace errors
        run: git diff --check
