name: Bastilla Local MCP

on:
  push:
    branches: [main]
    paths:
      - '.codex/config.toml'
      - 'scripts/bastilla-mcp-stdio.mjs'
      - 'tests/mcp-stdio.test.mjs'
      - '.github/workflows/local-mcp-check.yml'
  pull_request:
    paths:
      - '.codex/config.toml'
      - 'scripts/bastilla-mcp-stdio.mjs'
      - 'tests/mcp-stdio.test.mjs'
      - '.github/workflows/local-mcp-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdio-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline MCP protocol smoke test
        run: node --test tests/mcp-stdio.test.mjs
